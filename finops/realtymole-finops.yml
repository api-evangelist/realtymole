meters:
- name: api_requests
  description: Billable API calls across all endpoints; each call consumes monthly quota.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - endpoint
  - plan
- name: overage_requests
  description: Requests above the monthly plan quota, billed at the per-request overage rate.
  unit: requests
  aggregation: sum
  dimensions:
  - account
  - plan
- name: subscription_fee
  description: Flat monthly subscription/plan fee for the selected tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track request counts per endpoint and tier from the RapidAPI / RentCast dashboard; watch quota burn-down.
- name: Allocation
  description: Use separate API keys per workload/team to attribute request spend to cost centers.
- name: Optimization
  description: Cache property records and estimates, deduplicate address lookups, and right-size the monthly plan to expected request volume to avoid overage.
- name: Accountability
  description: Assign an owner per key, set quota alerts, and review monthly request spend against budget; plan migration off legacy Realty Mole to RentCast.
maintainers:
