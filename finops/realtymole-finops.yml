description: >-
  FinOps view of Realty Mole Property API spend. The legacy Realty Mole API is
  billed through RapidAPI as a monthly subscription tier plus per-request
  overage; every endpoint call (property records, rent estimate, sale estimate,
  listings) is a metered request. The successor RentCast API bills a flat
  monthly plan fee plus per-request overage. Because each successful API call
  consumes quota, request volume is the primary cost driver.
notes: >-
  Realty Mole is legacy; new spend should be planned against RentCast plans.
  Verify current per-request overage rates and monthly plan fees on the
  RapidAPI pricing page and rentcast.io during reconciliation.
sources:
- https://rapidapi.com/realtymole/api/realty-mole-property-api/pricing
- https://www.rentcast.io/api
- https://developers.rentcast.io/reference/realty-mole-migration-guide
- https://focus.finops.org/focus-specification/v1-3/
