publisherName: RealtyMole
serviceCategory: Real Estate and Property Data
billingModel:
  pricingCategory: Subscription plus Usage Overage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Realty Mole Property API
  ServiceCategory: Real Estate and Property Data
  ProviderName: RealtyMole
  PublisherName: RealtyMole
  InvoiceIssuerName: RapidAPI
  BillingCurrency: USD
