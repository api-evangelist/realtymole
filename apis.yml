    type: Documentation
  - url: openapi/realtymole-openapi.yml
    type: OpenAPI
  description: Estimate the long-term monthly rent for a target property by address
    or latitude/longitude using a comparable-properties (AVM) algorithm, returning
    a rent estimate, a low/high range, and the comparable listings used.
- aid: realtymole:sale-estimate
