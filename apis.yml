  humanURL: https://rapidapi.com/realtymole/api/realty-mole-property-api
  baseURL: https://realty-mole-property-api.p.rapidapi.com
  properties:
  - url: https://rapidapi.com/realtymole/api/realty-mole-property-api
    type: Documentation
  - url: openapi/realtymole-openapi.yml
    type: OpenAPI
  description: Estimate the market sale price (value) of a target property by address
    or latitude/longitude using a comparable-sales (AVM) algorithm, returning a price
    estimate, a low/high range, and the comparable sales used.
