    type: OpenAPI
  description: Look up residential property records by address or latitude/longitude,
    returning attributes such as property type, bedrooms, bathrooms, square footage,
    lot size, year built, last sale price/date, owner and assessor data.
- aid: realtymole:rental-estimate
  name: RealtyMole Rental Estimate API
  tags:
  - Rental Estimate
  - AVM
  - Comparables
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://rapidapi.com/realtymole/api/realty-mole-property-api
  baseURL: https://realty-mole-property-api.p.rapidapi.com
  properties:
