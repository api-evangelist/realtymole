name: RealtyMole
kind: company
description: RealtyMole (Realty Mole Property API) is a US real-estate and property
  data API distributed primarily through RapidAPI. It returns property records, AVM-based
  rental estimates and sale-price (value) estimates with comparable properties, and
  active for-sale and for-rent listings by address or latitude/longitude. RealtyMole
  is the predecessor product to RentCast (rentcast.io); the standalone Realty Mole
  Property API on RapidAPI is legacy and superseded by the RentCast API.
